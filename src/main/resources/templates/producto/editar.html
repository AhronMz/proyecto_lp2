<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Actualizar Producto | PrimeWash</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
	<div th:replace="~{fragments/navbar :: barraNavegacion}"></div>
	<div class="container my-5">
		<div class="card shadow-lg border-0">
			<div class="card-header bg-dark text-white py-3">
				<h3 class="card-title m-0">
					<i class="fa-regular fa-pen-to-square me-2"></i>
					<span th:text="|Producto a Editar - Id ${producto.codProducto}|"></span>
				</h3>
			</div>
			<div class="card-body p-4">
				<form th:action="@{/menu/producto/actualizar}" th:object="${producto}" method="post">
					<!-- ID OCULTO -->
					<input type="hidden" th:field="*{codProducto}" />

					<h5 class="text-primary mb-3"><i class="fa-solid fa-circle-info me-2"></i>Información del Producto</h5>
					<div class="row g-3 mb-4">
						<div class="col-md-6">
							<label for="nomProducto" class="form-label fw-bold">Nombre del Producto</label>
							<input th:field="*{nomProducto}" type="text" class="form-control" id="nomProducto" required>
						</div>
						<div class="col-md-6">
							<label for="categoria" class="form-label fw-bold">Categoría</label>
							<select th:field="*{categoria}" class="form-select" id="categoria" required>
								<option value="">-- Seleccione Categoría --</option>
								<option th:each="c : ${lstCategoria}" th:value="${c.codCategoria}" th:text="${c.nomCategoria}"></option>
							</select>
						</div>
						<div class="col-md-12">
							<label for="despProducto" class="form-label fw-bold">Descripción Corta</label>
							<input th:field="*{despProducto}" type="text" class="form-control" id="despProducto" required>
						</div>
					</div>

					<h5 class="text-primary mb-3"><i class="fa-solid fa-boxes-stacked me-2"></i>Inventario y Precios</h5>
					<div class="row g-3 mb-4">
						<div class="col-md-4">
							<label for="preProducto" class="form-label fw-bold">Precio Unitario (S/)</label>
							<input th:field="*{preProducto}" type="number" step="0.01" class="form-control" id="preProducto" required>
						</div>
						<div class="col-md-4">
							<label for="canProducto" class="form-label fw-bold">Stock Actual</label>
							<input th:field="*{canProducto}" type="number" class="form-control" id="canProducto" required>
						</div>
						<div class="col-md-4">
							<label for="fecIngreso" class="form-label fw-bold">Fecha de Ingreso</label>
							<input th:value="${#temporals.format(producto.fecIngreso, 'yyyy-MM-dd')}" type="date" class="form-control" id="fecIngreso" name="fecIngreso" required>
						</div>
					</div>

					<hr class="my-4">
					<div class="d-flex justify-content-end gap-2">
						<a th:href="@{/menu/producto/listado}" class="btn btn-secondary px-4">
							<i class="fa-solid fa-xmark me-1"></i> Cancelar
						</a>
						<button type="submit" class="btn btn-primary px-4">
							<i class="fa-solid fa-rotate me-1"></i> Actualizar Producto
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
	<th:block th:utext="${alert}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
