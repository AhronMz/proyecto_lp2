<html xmlns:th="http://www.thymeleaf.org" th:replace="menu/menuPrincipal :: layoutBase(~{::contenido})">


<div th:fragment="contenido">

	<div class="card shadow-lg">
		<div class="card-body">
			<div class="row mb-3">
				<div class="col-md-10">
					<h1 class="card-title">Listado de Productos</h1>
				</div>
				<div class="col-md-2">
					<a th:href="@{/menu/producto/nuevo}" class="btn btn-success w-100">
						<i class="fa-solid fa-plus"></i> Nuevo
					</a>
				</div>
			</div>

			<div class="mb-3">
				<fieldset class="border border-2 border-dark px-2 pb-2">
					<legend class="float-none w-auto px-2">Filtros</legend>
					<form th:action="@{/menu/producto/listado}" method="get" th:object="${filter}">
						<div class="row align-items-end">
							<div class="col-md-4">
								<label for="codCategoria" class="form-label">Categoría</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-tags"></i></span>
									<select class="form-select" th:field="*{codCategoria}">
										<option value="">--Todas--</option>
										<option th:each="item:${lstCategoria}" th:value="${item.codCategoria}"
											th:text="${item.nomCategoria}"></option>
									</select>
								</div>
							</div>
							
							<div class="col-md-3">
								<label for="estado" class="form-label fw-bold">Estado</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-toggle-on"></i></span>
									<select class="form-select" th:field="*{estado}">
										<option value="">-- Todos --</option>
										<option value="true">Habilitados</option>
										<option value="false">Inhabilitados</option>
									</select>
								</div>
							</div>
							
							<div class="col text-end">
								<button type="submit" class="btn btn-outline-dark">
									<i class="fa-solid fa-binoculars"></i> Buscar
								</button>
								<a th:href="@{/menu/producto/listado}" class="btn btn-outline-secondary">
									<i class="fa-solid fa-broom"></i> Limpiar
								</a>
							</div>
							
						</div>
					</form>
				</fieldset>
			</div>

			<div class="table-responsive overflow-auto" style="max-height: 70vh;">
				<table class="table table-hover">
					<thead class="table-dark text-center">
						<tr class="position-sticky top-0">
							<th>Código</th>
							<th>Nombre Producto</th>
							<th>Descripción</th>
							<th>Categoría</th>
							<th>Stock</th>
							<th>Precio Unit.</th>
							<th>Fec. Ingreso</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody class="table-secondary">
						<tr th:each="p : ${lstProducto}">
							<td th:text="${p.codProducto}" class="text-center"></td>
							<td th:text="${p.nomProducto}"></td>
							<td th:text="${p.despProducto}"></td>
							<td th:text="${p.categoria.nomCategoria}"></td>
							<td th:text="${p.canProducto}" class="text-center"></td>
							<td th:text="|S/ ${p.preProducto}|" class="text-center"></td>
							<td th:text="${#temporals.format(p.fecIngreso, 'dd-MM-yyyy')}" class="text-center"></td>
							
							<td class="d-flex justify-content-evenly align-items-center text-center">							
								<a th:href="@{/menu/producto/editar/{id}(id=${p.codProducto})}"
									class="btn btn-outline-primary" title="Editar" aria-label="Editar" role="button">
									<i class="fa-regular fa-pen-to-square"></i>
								</a>
								
								<div class="form-check form-switch m-0 p-0" style="min-height: auto;">
									<input class="form-check-input ms-0" type="checkbox" role="switch"
										th:checked="${p.estado}" title="Cambiar Estado (Habilitar/Inhabilitar)"
										th:onchange="|window.location.href='@{/menu/producto/cambiar-estado/{id}(id=${p.codProducto})}'|"
										style="cursor: pointer;">
								</div>
							</td>							
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

</html>
