<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>Listado de Clientes | PrimeWash</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
	<div th:replace="~{fragments/navbar :: barraNavegacion}"></div>
	<div class="container mt-5">
		<div class="card shadow-lg">
			<div class="card-body">
				<div class="row mb-3">
					<div class="col-md-10">
						<h1 class="card-title">Listado de Clientes</h1>
					</div>
					<div class="col-md-2">
						<a th:href="@{/menu/cliente/nuevo}" class="btn btn-success w-100">
							<i class="fa-solid fa-plus"></i> Nuevo
						</a>
					</div>
				</div>
				<div class="table-responsive overflow-auto" style="max-height: 70vh;">
					<table class="table table-hover">
						<thead class="table-dark text-center">
							<tr class="position-sticky top-0">
								<th>Código</th>
								<th>Nombres</th>
								<th>Apellidos</th>
								<th>Tipo Doc.</th>
								<th>Documento</th>
								<th>Celular</th>
								<th>Sexo</th>
								<th>Distrito</th>
								<th>Fecha Registro</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody class="table-secondary">
							<tr th:each="c : ${lstCliente}">
								<td th:text="${c.codCliente}" class="text-center"></td>
								<td th:text="${c.nomCliente}"></td>
								<td th:text="|${c.apePaternoCliente} ${c.apeMaternoCliente}|"></td>
								<td th:text="${c.tipoDocumento}" class="text-center"></td>
								<td th:text="${c.docId}" class="text-center"></td>
								<td th:text="${c.telCliente}" class="text-center"></td>
								<td th:text="${c.sexo.nomSexo}" class="text-center"></td>
								<td th:text="${c.distrito.nomDistrito}"></td>
								<td th:text="${#temporals.format(c.fecRegistro, 'dd-MM-yyyy')}" class="text-center">
								</td>
								<td class="d-flex justify-content-evenly align-items-center text-center">
									<a th:href="@{/menu/cliente/editar/{id}(id=${c.codCliente})}"
										class="btn btn-outline-primary" title="Editar" aria-label="Editar"
										role="button">
										<i class="fa-regular fa-pen-to-square"></i>
									</a>
								</td>

							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	<th:block th:utext="${alert}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
