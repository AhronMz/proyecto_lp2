<html xmlns:th="http://www.thymeleaf.org" th:replace="menu/menuPrincipal :: layoutBase(~{::contenido})">


<div th:fragment="contenido">

	<div class="card shadow-lg">
		<div class="card-body">
			<div class="row mb-3">
				<div class="col-md-10">
					<h1 class="card-title">Listado de Clientes</h1>
				</div>
				<div class="col-md-2">
					<a th:href="@{/menu/cliente/nuevo}" class="btn btn-success w-100">
						<i class="fa-solid fa-plus"></i> Nuevo
					</a>
				</div>
			</div>

			<div class="mb-3">
				<fieldset class="border border-2 border-dark px-2 pb-2">
					<legend class="float-none w-auto px-2">Filtros</legend>
					<form th:action="@{/menu/cliente/listado}" method="get" th:object="${filter}">
						<div class="row align-items-end">
							<div class="col-md-3">
								<label for="codDistrito" class="form-label">Distrito</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-chalkboard-user"></i></span>
									<select class="form-select" th:field="*{codDistrito}">
										<option value="">--Todos--</option>
										<option th:each="item:${lstDistrito}" th:value="${item.codDistrito}"
											th:text="${item.nomDistrito}"></option>
									</select>
								</div>
							</div>
							<div class="col text-end">
								<button type="submit" class="btn btn-outline-dark">
									<i class="fa-solid fa-binoculars"></i> Buscar
								</button>
								<a th:href="@{/menu/cliente/listado}" class="btn btn-outline-secondary">
									<i class="fa-solid fa-broom"></i> Limpiar
								</a>
							</div>
						</div>
					</form>
				</fieldset>
			</div>

			<div class="table-responsive overflow-auto" style="max-height: 70vh;">
				<table class="table table-hover">
					<thead class="table-dark text-center">
						<tr class="position-sticky top-0">
							<th>Código</th>
							<th>Nombres</th>
							<th>Apellidos</th>
							<th>Tipo Doc.</th>
							<th>Documento</th>
							<th>Celular</th>
							<th>Sexo</th>
							<th>Distrito</th>
							<th>Fecha Registro</th>
							<th th:if="${session.ID_TIPO == 1}">Acciones</th>
						</tr>
					</thead>
					<tbody class="table-secondary">
						<tr th:each="c : ${lstCliente}">
							<td th:text="${c.codCliente}" class="text-center"></td>
							<td th:text="${c.nomCliente}"></td>
							<td th:text="|${c.apePaternoCliente} ${c.apeMaternoCliente}|"></td>
							<td th:text="${c.tipoDocumento}" class="text-center"></td>
							<td th:text="${c.docId}" class="text-center"></td>
							<td th:text="${c.telCliente}" class="text-center"></td>
							<td th:text="${c.sexo.nomSexo}" class="text-center"></td>
							<td th:text="${c.distrito.nomDistrito}"></td>
							<td th:text="${#temporals.format(c.fecRegistro, 'dd-MM-yyyy')}" class="text-center">
							</td>
							<td class="text-center" th:if="${session.ID_TIPO == 1}">
							<div class="d-flex justify-content-evenly align-items-center text-center">
								<a th:href="@{/menu/cliente/editar/{id}(id=${c.codCliente})}"
									class="btn btn-outline-primary" title="Editar" aria-label="Editar" role="button">
									<i class="fa-regular fa-pen-to-square"></i>
								</a>
							</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

</div>



</html>
