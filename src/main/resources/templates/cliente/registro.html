<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Registrar Nuevo Cliente | PrimeWash</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

	<div class="container my-5">
		<div class="card shadow-lg border-0">
			<!-- ENCABEZADO DE LA TARJETA -->
			<div class="card-header bg-dark text-white py-3">
				<h3 class="card-title m-0">
					<i class="fa-solid fa-user-plus me-2"></i>Registrar Nuevo Cliente
				</h3>
			</div>

			<div class="card-body p-4">
				<form th:action="@{/menu/cliente/registrar}" th:object="${cliente}" method="post">

					<!-- 1. INFORMACIÓN PERSONAL -->
					<h5 class="text-primary mb-3"><i class="fa-solid fa-id-card me-2"></i>Información Personal</h5>
					<div class="row g-3 mb-4">
						<div class="col-md-4">
							<label for="nomCliente" class="form-label fw-bold">Nombres</label>
							<input th:field="*{nomCliente}" type="text" class="form-control" id="nomCliente" placeholder="Ej: Juan Carlos" required>
						</div>
						<div class="col-md-4">
							<label for="apePaternoCliente" class="form-label fw-bold">Apellido Paterno</label>
							<input th:field="*{apePaternoCliente}" type="text" class="form-control" id="apePaternoCliente" placeholder="Ej: Pérez" required>
						</div>
						<div class="col-md-4">
							<label for="apeMaternoCliente" class="form-label fw-bold">Apellido Materno</label>
							<input th:field="*{apeMaternoCliente}" type="text" class="form-control" id="apeMaternoCliente" placeholder="Ej: Gómez" required>
						</div>
					</div>

					<!-- 2. DOCUMENTO Y CONTACTO -->
					<h5 class="text-primary mb-3"><i class="fa-solid fa-address-book me-2"></i>Documento y Contacto</h5>
					<div class="row g-3 mb-4">
						<div class="col-md-4">
							<label for="tipoDocumento" class="form-label fw-bold">Tipo de Documento</label>
							<select th:field="*{tipoDocumento}" class="form-select" id="tipoDocumento" required>
								<option value="">-- Seleccione Tipo --</option>
								<option value="DNI">DNI</option>
								<option value="RUC">RUC</option>
								<option value="C.E">CARNET DE EXTRANJERÍA</option>
							</select>
						</div>
						<div class="col-md-4">
							<label for="docId" class="form-label fw-bold">Número de Documento</label>
							<input th:field="*{docId}" type="text" class="form-control" id="docId" placeholder="Ej: 75469845" required>
						</div>
						<div class="col-md-4">
							<label for="telCliente" class="form-label fw-bold">Celular / Teléfono</label>
							<input th:field="*{telCliente}" type="text" class="form-control" id="telCliente" placeholder="Ej: 987654321" required>
						</div>
					</div>

					<!-- 3. INFORMACIÓN ADICIONAL Y CATÁLOGOS -->
					<h5 class="text-primary mb-3"><i class="fa-solid fa-list-check me-2"></i>Información Adicional</h5>
					<div class="row g-3 mb-4">
						<div class="col-md-4">
							<label for="sexo" class="form-label fw-bold">Sexo</label>
							<select th:field="*{sexo}" class="form-select" id="sexo" required>
								<option value="">-- Seleccione Sexo --</option>
								<option th:each="s : ${lstSexo}" 
										th:value="${s.codSexo}" 
										th:text="${s.nomSexo}">
								</option>
							</select>
						</div>
						<div class="col-md-4">
							<label for="distrito" class="form-label fw-bold">Distrito</label>
							<select th:field="*{distrito}" class="form-select" id="distrito" required>
								<option value="">-- Seleccione Distrito --</option>
								<option th:each="d : ${lstDistrito}" 
										th:value="${d.codDistrito}" 
										th:text="${d.nomDistrito}">
								</option>
							</select>
						</div>
						<div class="col-md-4">
							<label for="fecRegistro" class="form-label fw-bold">Fecha de Registro</label>
							<input th:value="${#temporals.format(fecRegistro, 'yyyy-MM-dd')}" type="date" class="form-control" id="fecRegistro" name="fecRegistro" required>
						</div>
					</div>

					<hr class="my-4">

					<!-- BOTONES DE ACCIÓN -->
					<div class="d-flex justify-content-end gap-2">
						<a th:href="@{/menu/cliente/listado}" class="btn btn-secondary px-4">
							<i class="fa-solid fa-xmark me-1"></i> Cancelar
						</a>
						<button type="submit" class="btn btn-success px-4">
							<i class="fa-solid fa-floppy-disk me-1"></i> Guardar Cliente
						</button>
					</div>

				</form>
			</div>
		</div>
	</div>

	<th:block th:utext="${alert}"></th:block>
</body>

</html>
