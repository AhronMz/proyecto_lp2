<html xmlns:th="http://www.thymeleaf.org" th:replace="menu/menuPrincipal :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
	<div class="row mb-4">
		<div class="col-12">
			<h3 class="text-center fw-bold mb-1 d-flex justify-content-center align-items-center gap-2">
				<img th:src="@{/imagenes/logo-primewash.svg}" alt="Logo PrimeWash" height="40">
				PRIMEWASH
			</h3>
			<p class="mb-0">Bienvenido, <span th:text="${session.fullName}">usuario</span>. Elige una opción para continuar.</p>
		</div>
	</div>

	<div class="row g-4">
		<div class="col-12 col-md-4">
			<div class="card shadow-lg h-100 text-dark text-center">
				<div class="card-body d-flex flex-column">
					<i class="fa-solid fa-users fa-3x text-primary mb-3"></i>
					<h4 class="card-title">Clientes</h4>
					<p class="text-muted">Registra y administra tus clientes.</p>
					<a th:href="@{/menu/cliente/listado}" class="btn btn-primary mt-auto">Ir a clientes</a>
				</div>
			</div>
		</div>
		<div class="col-12 col-md-4">
			<div class="card shadow-lg h-100 text-dark text-center">
				<div class="card-body d-flex flex-column">
					<i class="fa-solid fa-user-tie fa-3x text-primary mb-3"></i>
					<h4 class="card-title">Empleados</h4>
					<p class="text-muted">Registra y administra tu personal.</p>
					<a th:href="@{/menu/empleado/listado}" class="btn btn-primary mt-auto">Ir a empleados</a>
				</div>
			</div>
		</div>
		<div class="col-12 col-md-4">
			<div class="card shadow-lg h-100 text-dark text-center">
				<div class="card-body d-flex flex-column">
					<i class="fa-solid fa-boxes-stacked fa-3x text-primary mb-3"></i>
					<h4 class="card-title">Productos</h4>
					<p class="text-muted">Controla el inventario de productos.</p>
					<a th:href="@{/menu/producto/listado}" class="btn btn-primary mt-auto">Ir a productos</a>
				</div>
			</div>
		</div>
	</div>
</div>
</html>
