<html xmlns:th="http://www.thymeleaf.org" th:replace="menu/menuPrincipal :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
    <div class="card shadow-lg col-md-8 mx-auto">
        <div class="card-header bg-success text-white">
            <h3 class="card-title mb-0"><i class="fa-solid fa-plus me-2"></i>Registrar Nuevo Servicio</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/menu/servicio/registrar}" method="post" th:object="${servicio}">
                
                <div class="mb-3">
                    <label for="nomser" class="form-label fw-bold">Nombre del Servicio</label>
                    <input type="text" class="form-control" th:field="*{nomser}" 
                           placeholder="Ej. Lavado Express / Carrocería" required>
                </div>

                <div class="mb-3">
                    <label for="desser" class="form-label fw-bold">Descripción</label>
                    <textarea class="form-control" th:field="*{desser}" rows="3" 
                              placeholder="Detalla qué incluye el servicio..."></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="preser" class="form-label fw-bold">Precio (S/)</label>
                        <div class="input-group">
                            <span class="input-group-text">S/</span>
                            <input type="number" step="0.10" min="0" class="form-control" th:field="*{preser}" 
                                   placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="duracionMin" class="form-label fw-bold">Duración Estimada (min)</label>
                        <div class="input-group">
                            <input type="number" min="1" class="form-control" th:field="*{duracionMin}" 
                                   placeholder="30" required>
                            <span class="input-group-text">min</span>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/menu/servicio/listado}" class="btn btn-secondary">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Guardar
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</html>
