<html xmlns:th="http://www.thymeleaf.org" th:replace="menu/menuPrincipal :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
    <div class="card shadow-lg">
        <div class="card-body">
            <div class="row mb-3 align-items-center">
                <div class="col-md-10">
                    <h1 class="card-title">Listado de Servicios</h1>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/menu/servicio/nuevo}" class="btn btn-success w-100">
                        <i class="fa-solid fa-plus"></i> Nuevo
                    </a>
                </div>
            </div>

            <!-- FILTROS -->
            <div class="mb-3">
                <fieldset class="border border-2 border-dark px-3 pb-3 pt-2 rounded">
                    <legend class="float-none w-auto px-2 fw-bold text-dark fs-6">
                        <i class="fa-solid fa-filter me-1"></i> Filtros
                    </legend>
                    <form th:action="@{/menu/servicio/listado}" method="get" th:object="${filter}">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label for="estado" class="form-label fw-bold">Estado</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-toggle-on"></i></span>
                                    <select class="form-select" th:field="*{estado}">
                                        <option value="">-- Todos --</option>
                                        <option value="true">Habilitados</option>
                                        <option value="false">Inhabilitados</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4 text-end d-flex gap-2">
                                <button type="submit" class="btn btn-outline-dark w-100">
                                    <i class="fa-solid fa-binoculars me-1"></i> Buscar
                                </button>
                                <a th:href="@{/menu/servicio/listado}" class="btn btn-outline-secondary w-100">
                                    <i class="fa-solid fa-broom me-1"></i> Limpiar
                                </a>
                            </div>
                        </div>
                    </form>
                </fieldset>
            </div>

            <!-- TABLA -->
            <div class="table-responsive overflow-auto" style="max-height: 70vh;">
                <table class="table table-hover align-middle">
                    <thead class="table-dark text-center">
                        <tr class="position-sticky top-0">
                            <th>Código</th>
                            <th>Nombre Servicio</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Duración (min)</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="table-secondary">
                        <tr th:each="s : ${lstServicio}">
                            <td th:text="${s.codser}" class="text-center"></td>
                            <td th:text="${s.nomser}"></td>
                            <td th:text="${s.desser}"></td>
                            <td th:text="|S/ ${s.preser}|" class="text-center"></td>
                            <td th:text="${s.duracionMin}" class="text-center"></td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center align-items-center gap-2">
                                    <a th:href="@{/menu/servicio/editar/{id}(id=${s.codser})}"
                                        class="btn btn-outline-primary btn-sm" title="Editar">
                                        <i class="fa-regular fa-pen-to-square"></i>
                                    </a>
                                    <div class="form-check form-switch m-0 p-0" style="min-height: auto;">
                                        <input class="form-check-input ms-0" type="checkbox" role="switch"
                                            th:checked="${s.estado}" title="Cambiar Estado"
                                            th:onchange="|window.location.href='@{/menu/servicio/cambiar-estado/{id}(id=${s.codser})}'|"
                                            style="cursor: pointer;">
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</html>
