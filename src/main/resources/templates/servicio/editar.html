<html xmlns:th="http://www.thymeleaf.org" th:replace="menu/menuPrincipal :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
    <div class="card shadow-lg col-md-8 mx-auto">
        <div class="card-header bg-primary text-white">
            <h3 class="card-title mb-0"><i class="fa-regular fa-pen-to-square me-2"></i>Editar Servicio</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/menu/servicio/actualizar}" method="post" th:object="${servicio}">
                
                <!-- ID Oculto para identificar el registro -->
                <input type="hidden" th:field="*{codser}" />
                <input type="hidden" th:field="*{estado}" />

                <div class="mb-3">
                    <label for="nomser" class="form-label fw-bold">Nombre del Servicio</label>
                    <input type="text" class="form-control" th:field="*{nomser}" required>
                </div>

                <div class="mb-3">
                    <label for="desser" class="form-label fw-bold">Descripción</label>
                    <textarea class="form-control" th:field="*{desser}" rows="3"></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="preser" class="form-label fw-bold">Precio (S/)</label>
                        <div class="input-group">
                            <span class="input-group-text">S/</span>
                            <input type="number" step="0.10" min="0" class="form-control" th:field="*{preser}" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="duracionMin" class="form-label fw-bold">Duración Estimada (min)</label>
                        <div class="input-group">
                            <input type="number" min="1" class="form-control" th:field="*{duracionMin}" required>
                            <span class="input-group-text">min</span>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/menu/servicio/listado}" class="btn btn-secondary">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-arrows-rotate me-1"></i> Actualizar
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</html>
